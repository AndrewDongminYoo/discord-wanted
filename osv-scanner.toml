[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
reason = "deepmerge@4.3.1 has no compatible patched release as of 2026-10-28; GitHub lists no patch and npm latest remains 4.3.1. Reviewed scope: yarn why deepmerge --json reports only the development path jest -> @jest/core -> jest-config@30.5.2 -> deepmerge, with repository-owned Jest configuration. Package-level poisoning remains reachable in a synthetic null-prototype/payload-target check, so this is an unresolved development-tool risk, not a fix. The actual raw OSV 2.7.0 lock scan fails for this advisory. Exception approved by the root Codex maintenance coordinator on 2026-10-28. Remove this exception when a compatible patch or parent dependency change becomes available, or if a production consumer or untrusted configuration path appears."

[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4"
reason = "glob@13.0.6 via jest@30.5.2 -> @jest/core@30.5.2 -> @jest/reporters, jest-config and jest-runtime@30.5.2, and glob@10.5.0 via jest -> @jest/transform -> babel-plugin-istanbul@8.0.0 -> test-exclude@7.0.2, have no compatible patch as of 2026-11-05: the advisory covers >= 9.0.0, <= 14.0.1 and the fix is glob 14.0.2. jest 30.5.2 is the newest jest and those three packages still require glob@^13.0.6; babel-plugin-istanbul 8.0.2, its newest release, still requires test-exclude@^7.0.1, which requires glob@^10.4.1, and 10.5.0 is the last glob 10.x release. Medium severity, AbortSignal cancellation bypass that allows filesystem traversal after a timeout. Both paths start at the jest devDependency, and no first-party source imports glob. Approved on 2026-11-05. Re-evaluate when jest accepts glob 14 or babel-plugin-istanbul moves to a test-exclude release that does."

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
reason = "minimatch@10.2.6 via the eslint@10.13.0 devDependency (directly and through @eslint/config-array@0.23.5), the @typescript-eslint/parser@8.72.1 devDependency -> @typescript-eslint/typescript-estree@8.72.1, glob@13.0.6, and test-exclude@7.0.2, and minimatch@9.0.9 via test-exclude@7.0.2 -> glob@10.5.0, have no compatible patch as of 2026-11-05: the advisory covers >= 7.0.0, < 11.0.1 and the fix is minimatch 11.0.1. The newest eslint (10.14.0) requires minimatch@^10.2.6, @eslint/config-array 0.23.5 and @typescript-eslint/typescript-estree 8.72.1, both the newest releases, require ^10.2.4 and ^10.2.2, and 10.2.6 and 9.0.9 are the last releases of their lines. Medium severity, DoS through globparts. Reached only by lint and test tooling (eslint, jest), none of it a production dependency, and no first-party source imports minimatch. Approved on 2026-11-05. Re-evaluate when eslint, @eslint/config-array and typescript-estree accept minimatch 11 and the jest chain moves off glob 10 and 13."
